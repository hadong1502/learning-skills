[project]
name = "learning-skills"
version = "0.1.0"
description = "Tooling for the learn / quiz / visualize Claude Code skills"
requires-python = ">=3.12,<3.13"
dependencies = [
    "marker-pdf>=1.10.2,<2",  # 2.x needs a vLLM/llama.cpp server; 1.x runs torch in-process
    "torch>=2.7.0",
    "pymupdf>=1.24",
    "sympy>=1.13",
    "fsrs>=6.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
