<!doctype html>
<!-- Live widget template: 2-D linear rate network  dx/dt = -x + W x.
     Copy to <course>/.learn/viz/<slug>/index.html and adapt: the model (flow), the sliders,
     the readouts. Keep it one self-contained file; libraries only from cdnjs, pinned. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linear network explorer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jsxgraph/1.11.1/jsxgraph.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsxgraph/1.11.1/jsxgraphcore.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"
  onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]})"></script>
<style>
:root{--bg:#f6f6f7;--panel:#fff;--fg:#1b1b1f;--muted:#5d5d66;--line:#d9d9de;--a:#1f7a99;--b:#c0392b;--c:#2e8b57}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f0f11;--panel:#18181b;--fg:#e8e8ea;--muted:#9a9aa2;--line:#2c2c31;--a:#58c4dd;--b:#ff6b5b;--c:#83c167}}
:root[data-theme="dark"]{--bg:#0f0f11;--panel:#18181b;--fg:#e8e8ea;--muted:#9a9aa2;--line:#2c2c31;--a:#58c4dd;--b:#ff6b5b;--c:#83c167}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1150px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:20px;margin:0 0 4px} .desc{color:var(--muted);margin:0 0 14px}
.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:14px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.jxg{width:100%;aspect-ratio:1/1;border:none}
.jxg.wide{aspect-ratio:4/3}
.sliders{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;margin-top:8px}
.sliders input{accent-color:var(--a)} .val{font-variant-numeric:tabular-nums;min-width:3.5em;text-align:right}
.readout{margin-top:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.readout b{color:var(--fg)}
.presets button{background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:4px 10px;margin:6px 6px 0 0;cursor:pointer;font:inherit}
.presets button:hover{border-color:var(--a)}
</style></head>
<body><main>
<h1>Linear network explorer</h1>
<p class="desc">$\dot{\mathbf x} = -\mathbf x + W\mathbf x$. Drag the initial condition (the large dot); move the sliders to change $W$.
Right: $\lVert \mathbf x(t)\rVert$. A transient rise above $\lVert\mathbf x(0)\rVert$ in a stable network is non-normal amplification.</p>
<div class="grid">
 <div class="card"><div id="phase" class="jxg"></div></div>
 <div class="card">
  <div id="norm" class="jxg wide"></div>
  <div class="sliders" id="sliders"></div>
  <div class="presets">
   <button data-w="0.5,0,0,0.5">normal (diag 0.5)</button>
   <button data-w="0.5,4,0,0.5">non-normal (practice exam $W_2$)</button>
   <button data-w="0,1,1,0">line attractor</button>
   <button data-w="1,-1.5,1,-1.5">E-I balanced</button>
  </div>
  <div class="readout" id="readout"></div>
 </div>
</div>
</main>
<script>
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const W = {a: 0.5, b: 4, c: 0, d: 0.5};            // W = [[a, b], [c, d]]
const RANGE = {min: -5, max: 5, step: 0.05};
const T = 12, DT = 0.01;

const flow = (x, y) => [-x + W.a * x + W.b * y, -y + W.c * x + W.d * y];

function integrate(x0, y0) {                         // RK4
  const xs = [[x0, y0]];
  let x = x0, y = y0;
  for (let i = 0; i < T / DT; i++) {
    const k1 = flow(x, y), k2 = flow(x + DT / 2 * k1[0], y + DT / 2 * k1[1]);
    const k3 = flow(x + DT / 2 * k2[0], y + DT / 2 * k2[1]), k4 = flow(x + DT * k3[0], y + DT * k3[1]);
    x += DT / 6 * (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]);
    y += DT / 6 * (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1]);
    xs.push([x, y]);
    if (Math.abs(x) > 1e3 || Math.abs(y) > 1e3) break;
  }
  return xs;
}

function eig() {                                     // eigenvalues of J = -I + W
  const A = W.a - 1, D = W.d - 1, tr = A + D, det = A * D - W.b * W.c, disc = tr * tr - 4 * det;
  if (disc >= 0) return [(tr + Math.sqrt(disc)) / 2, (tr - Math.sqrt(disc)) / 2].map(v => v.toFixed(2));
  const re = (tr / 2).toFixed(2), im = (Math.sqrt(-disc) / 2).toFixed(2);
  return [`${re} + ${im}i`, `${re} − ${im}i`];
}

JXG.Options.text.cssDefaultStyle = 'font-family: system-ui; color:' + css('--fg');
const opts = {axis: true, showCopyright: false, showNavigation: false, pan: {enabled: false}, zoom: {enabled: false}};
const phase = JXG.JSXGraph.initBoard('phase', {...opts, boundingbox: [-1.5, 1.5, 1.5, -1.5]});
const normB = JXG.JSXGraph.initBoard('norm', {...opts, boundingbox: [-0.5, 3.2, T, -0.3]});

const direction = (x, y) => {                       // unit arrows: strong non-normal coupling would swamp the plot
  const [u, v] = flow(x, y), n = Math.hypot(u, v) || 1;
  return [u / n, v / n];
};
phase.create('vectorfield', [direction, [-1.5, 16, 1.5], [-1.5, 16, 1.5]],
  {strokeColor: css('--muted'), strokeOpacity: 0.55, scale: 0.07});
const P = phase.create('point', [0, 1], {name: '', size: 6, fillColor: css('--b'), strokeColor: css('--b')});
const traj = phase.create('curve', [[0], [0]], {strokeColor: css('--a'), strokeWidth: 3});
const nCurve = normB.create('curve', [[0], [0]], {strokeColor: css('--a'), strokeWidth: 3});
const n0 = normB.create('line', [[0, 1], [1, 1]], {strokeColor: css('--muted'), dash: 2, strokeWidth: 1, fixed: true});

function redraw() {
  const xs = integrate(P.X(), P.Y());
  traj.dataX = xs.map(p => p[0]); traj.dataY = xs.map(p => p[1]);
  const n = xs.map(p => Math.hypot(p[0], p[1])), t = n.map((_, i) => i * DT);
  nCurve.dataX = t; nCurve.dataY = n;
  const peak = Math.max(...n), n0v = n[0];
  n0.point1.setPosition(JXG.COORDS_BY_USER, [0, n0v]); n0.point2.setPosition(JXG.COORDS_BY_USER, [1, n0v]);
  normB.setBoundingBox([-0.5, Math.max(1.2 * peak, 0.5), T, -0.1 * Math.max(peak, 1)]);
  const ev = eig();
  document.getElementById('readout').innerHTML =
    `eigenvalues of $-I + W$: <b>${ev[0]}</b>, <b>${ev[1]}</b> &nbsp;·&nbsp; peak ‖x‖ / ‖x(0)‖ = <b>${(peak / n0v).toFixed(2)}</b>` +
    ` &nbsp;·&nbsp; $WW^\\top = W^\\top W$? <b>${Math.abs(W.b * W.b - W.c * W.c) < 1e-9 && Math.abs((W.a - W.d) * (W.b - W.c)) < 1e-9 ? 'yes (normal)' : 'no (non-normal)'}</b>`;
  if (window.renderMathInElement) renderMathInElement(document.getElementById('readout'),
    {delimiters: [{left: '$', right: '$', display: false}]});
  phase.update(); normB.update();
}

const box = document.getElementById('sliders');
for (const [k, label] of [['a', 'W₁₁'], ['b', 'W₁₂'], ['c', 'W₂₁'], ['d', 'W₂₂']]) {
  box.insertAdjacentHTML('beforeend', `<span>${label}</span><input type="range" id="s${k}" min="${RANGE.min}" max="${RANGE.max}" step="${RANGE.step}" value="${W[k]}"><span class="val" id="v${k}">${W[k].toFixed(2)}</span>`);
}
for (const k of 'abcd') {
  document.getElementById('s' + k).addEventListener('input', e => {
    W[k] = +e.target.value; document.getElementById('v' + k).textContent = W[k].toFixed(2); redraw();
  });
}
document.querySelectorAll('.presets button').forEach(btn => btn.addEventListener('click', () => {
  btn.dataset.w.split(',').map(Number).forEach((v, i) => {
    const k = 'abcd'[i]; W[k] = v; document.getElementById('s' + k).value = v; document.getElementById('v' + k).textContent = v.toFixed(2);
  });
  redraw();
}));
P.on('drag', redraw);
redraw();
</script></body></html>
